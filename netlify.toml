# ─────────────────────────────────────────────────────────────────────────
# Cache headers for self-hosted static media. These files are fingerprint-
# by-rename (change the filename when the content changes), so they can be
# cached forever. Next.js's own /_next/static/* assets already get
# immutable headers from the Netlify Next plugin.
# ─────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/hero-loop.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hero-poster.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brand assets keep their canonical names (scrapers and pinned tabs
# reference them), so they get a week of cache instead of immutable.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
