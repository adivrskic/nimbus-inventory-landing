[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─────────────────────────────────────────────────────────────────────────
# Canonical host: force www → apex so there's one canonical origin.
# (Matches the canonical/og:url, which use https://nautilusinventory.com.)
# ─────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "https://www.nautilusinventory.com/*"
  to = "https://nautilusinventory.com/:splat"
  status = 301
  force = true

# ─────────────────────────────────────────────────────────────────────────
# Blog slug migration (May 2026 rework). Preserve any link equity / shared
# links from the old posts. Renamed posts 301 to their new slug; removed
# posts (case studies + data-flex pieces) 301 to the blog index.
# Safe to keep even if the old URLs were never indexed — they simply never
# match. Remove once you're confident nothing references the old slugs.
# ─────────────────────────────────────────────────────────────────────────

